<!doctype html>
{% assign zh = false %}{% if page.url contains 'zh-TW' %}{% assign zh = true %}{% endif %}
<html lang="{% if zh %}zh-Hant{% else %}en{% endif %}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
{% seo %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&amp;family=Noto+Serif+TC:wght@400;600&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<header class="site-header">
  <div class="bar">
    <a class="wordmark" href="./">LogCarver</a>
    <nav>
      <a href="{% if zh %}faq.zh-TW.html{% else %}faq.html{% endif %}">{% if zh %}常見問題{% else %}FAQ{% endif %}</a>
      <a href="https://github.com/caiderek/LogCarver">GitHub</a>
    </nav>
  </div>
</header>
<main class="page">
{{ content }}
</main>
<footer class="site-footer">
  <div class="bar">
    <span>MIT License</span>
    <a href="https://github.com/caiderek/LogCarver">github.com/caiderek/LogCarver</a>
  </div>
</footer>
</body>
</html>
