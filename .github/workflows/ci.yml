name: ci
on:
  push:
    branches: [master]
  pull_request:
jobs:
  unit-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/LogCarver.Core.Tests -c Release
